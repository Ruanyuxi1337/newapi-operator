name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test ./... -race -count=1

      - name: build
        run: make build

      - name: version output
        run: ./bin/newapi-operator --version

      - name: route table integrity
        run: |
          ./bin/routesync --tag "$(grep -oP 'UpstreamVersion = "\K[^"]+' internal/spec/routes_gen.go)" \
            --out /dev/null --check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  drift:
    name: Upstream drift check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Compare embedded table with the newest New API release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go build -o /tmp/routesync ./cmd/routesync
          /tmp/routesync --tag latest --out /dev/null --check \
            || echo "::warning::The route table is behind the latest New API release. Run 'make sync' and review internal/spec."